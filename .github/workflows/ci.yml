name: CI

# Free checks only: lint, types, and unit tests. Nothing here calls the LLM or touches the database.
# Model evals (`pnpm eval`) spend AI Gateway credits and are run manually.
# Builds and deployments are handled by Vercel's Git integration (previews for PRs, production for main).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm next typegen
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
